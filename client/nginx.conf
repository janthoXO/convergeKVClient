# Rendered by the nginx image's envsubst at container start
# (Dockerfile copies this to /etc/nginx/templates/default.conf.template).
# ${API_URL} is the address of the bridge API, e.g. http://bridge:3001.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the SPA's same-origin /api/* calls to the bridge. The
    # browser only ever talks to this nginx; it never needs to resolve the
    # bridge's Docker hostname itself.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
