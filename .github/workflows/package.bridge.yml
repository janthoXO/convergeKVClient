name: Package Bridge

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 'latest'

jobs:
  build:
    uses: ./.github/workflows/build.bridge.yml

  package:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: bridge/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: bridge/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Set package.json version
        if: ${{ inputs.version && inputs.version != 'latest' }}
        run: pnpm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Docker Image
        run: docker build -t bridge:${{ inputs.version || 'latest' }} .

      - name: Save Docker Image
        run: docker save bridge:${{ inputs.version || 'latest' }} -o bridge-${{ inputs.version || 'latest' }}.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v6
        with:
          name: docker-image-bridge-${{ inputs.version || 'latest' }}
          path: bridge/bridge-${{ inputs.version || 'latest' }}.tar
          if-no-files-found: error