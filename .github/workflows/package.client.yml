name: Package Client

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 'latest'

jobs:
  build:
    uses: ./.github/workflows/build.client.yml

  package:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Set package.json version
        if: ${{ inputs.version && inputs.version != 'latest' }}
        run: pnpm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Docker Image
        run: docker build -t client:${{ inputs.version || 'latest' }} .

      - name: Save Docker Image
        run: docker save client:${{ inputs.version || 'latest' }} -o client-${{ inputs.version || 'latest' }}.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v6
        with:
          name: docker-image-client-${{ inputs.version || 'latest' }}
          path: client/client-${{ inputs.version || 'latest' }}.tar
          if-no-files-found: error